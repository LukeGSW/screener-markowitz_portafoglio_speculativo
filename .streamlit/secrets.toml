# Chiave EODHD. Serve SOLTANTO per costruire l'archivio
# (scripts/build_dataset.py). L'applicazione pubblicata legge l'archivio
# gia' pronto e non chiama mai EODHD: se pubblichi solo l'app, questa
# riga puoi anche ometterla.
EODHD_API_KEY = "LA_TUA_API_KEY_EODHD"

# Indirizzo da cui l'app scarica l'archivio quando non lo trova in locale.
# E' il prefisso degli asset della release di GitHub prodotta dal workflow
# "aggiorna-archivio". L'app vi appende il nome del file, per esempio
#   .../metrics.parquet
#   .../close_part_03.parquet
#
# Con il tag mobile "archivio-corrente" l'indirizzo non cambia mai, e ogni
# nuova costruzione va a sostituire gli asset precedenti.
ARCHIVE_URL = "https://github.com/TUO_UTENTE/TUO_REPO/releases/download/archivio-corrente"
